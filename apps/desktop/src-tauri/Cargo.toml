[package]
name = "boltie-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
boltie-core = { version = "0.1.0", path = "../../../crates/boltie-core" }
keyring = { version = "4.2.0", features = ["v1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.6", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["sync", "time", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[[bin]]
name = "boltie"
path = "src/main.rs"
