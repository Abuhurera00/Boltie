[package]
name = "boltie-core"
description = "Agent loop, tools and safety policy behind Boltie"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
dirs = "7.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
toml = "1.2.1"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
